{% extends "base.html" %}

{% block title %}Ticket Type | {{ BRAND_NAME or "Helpdesk" }}{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6 text-center">
        <div class="card card-outline card-info shadow-sm py-4">
            <div class="card-body">
                <i class="fas fa-question-circle fa-3x text-info mb-3"></i>
                <h3 class="font-weight-bold mb-3">Is this for a Project?</h3>
                <p class="text-muted mb-4">Choose whether this new ticket should be linked directly to an active project.</p>

                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ url_for('select_project_new_ticket') }}" class="btn btn-success btn-lg font-weight-bold px-4 mr-2">
                        <i class="fas fa-check mr-1"></i> Yes
                    </a>
                    <a href="{{ url_for('new_ticket') }}" class="btn btn-secondary btn-lg font-weight-bold px-4">
                        <i class="fas fa-times mr-1"></i> No
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
